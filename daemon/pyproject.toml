[project]
name = "agentring"
version = "0.1.0"
description = "Let any AI agent call your phone over VoIP and message you (daemon + CLI)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.15",
  "httpx>=0.28",
  "websockets>=14",
  "segno>=1.6",
  "pyyaml>=6",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Voice worker (M2+): LiveKit realtime SDK; livekit-agents and model plugins in M3.
voice = ["livekit>=1.1.20,<1.2"]

[project.scripts]
agentring = "agentring.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentring"]

[tool.pytest.ini_options]
testpaths = ["tests"]
