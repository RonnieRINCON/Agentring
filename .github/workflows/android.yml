name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_API_KEY: ak_ci_test_key

# Actions are pinned by commit SHA (comment = release tag); bump them deliberately.
permissions:
  contents: read

jobs:
  build-and-e2e:
    name: Build APK + emulator end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build APK and unit tests
        working-directory: app-android
        run: ./gradlew --stacktrace :core:test :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agentring-apk
          # The release build type (not debuggable), still signed with the public debug key.
          path: app-android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Start relay
        run: |
          cd relay && npm ci --no-audit --no-fund && npm run build
          mkdir -p "$RUNNER_TEMP/relay-data"
          PORT=8080 HOST=0.0.0.0 \
          AGENTRING_PUBLIC_URL=http://10.0.2.2:8080 AGENTRING_INSECURE_DEV=1 \
          AGENTRING_DATA_DIR="$RUNNER_TEMP/relay-data" AGENTRING_API_KEY="$CI_API_KEY" \
          AGENTRING_AGENT_NAME="CI Agent" \
            nohup node --disable-warning=ExperimentalWarning dist/main.js > "$RUNNER_TEMP/relay.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/healthz && break; sleep 1; done

      - name: Free disk space for the emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
            /usr/local/lib/android/sdk/ndk /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator end-to-end
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          disk-size: 3000M
          emulator-boot-timeout: 900
          working-directory: app-android
          script: ../scripts/ci-emulator-e2e.sh

      - name: Daemon sees the phone's replies
        working-directory: daemon
        run: |
          export AGENTRING_HOME="$RUNNER_TEMP/agentring-home"
          uv run agentring init --relay http://127.0.0.1:8080 --api-key "$CI_API_KEY"
          uv run agentring status
          uv run agentring replies --all --json | tee "$RUNNER_TEMP/replies.json"
          grep -q "respuesta desde la app" "$RUNNER_TEMP/replies.json"
          grep -q "sí, despliega" "$RUNNER_TEMP/replies.json"

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: |
            app-android/e2e-screenshots/
            app-android/app/build/reports/androidTests/
            ${{ runner.temp }}/relay.log
            ${{ runner.temp }}/logcat.txt
          if-no-files-found: warn

  publish-apk:
    name: Publish APK (android-preview release)
    needs: build-and-e2e
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agentring-apk
      - name: Replace the android-preview pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mv app-release.apk agentring.apk
          gh release delete android-preview --cleanup-tag --yes || true
          gh release create android-preview agentring.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "Android preview (${GITHUB_REF_NAME}, ${GITHUB_SHA::7})" \
            --notes "Preview build of the agentring Android app from ${GITHUB_SHA}, signed with the public debug key (see SECURITY.md). Passed the emulator end-to-end test. Install agentring.apk on your phone (allow installs from unknown sources)."
