name: CI

on:
  push:
  pull_request:

jobs:
  relay-daemon:
    name: Relay + daemon tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - name: Relay
        working-directory: relay
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
      - uses: astral-sh/setup-uv@v6
      - name: Daemon (unit + end-to-end against the relay build)
        working-directory: daemon
        run: uv run pytest -q
